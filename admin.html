<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1220"><title>Payments Admin | Katende Philbert</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="payments.css"><link rel="stylesheet" href="admin.css"></head>
<body class="payment-page admin-page">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">KP</span><span>Payments administration</span></a><a class="text-link" href="pay.html">Public checkout ↗</a></header>
<main class="admin-shell">
<section id="login-panel" class="payment-card admin-login"><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Sign in</h1><p class="field-hint">Access is restricted to the configured administrator email address.</p>
<form id="login-form"><label class="field-label" for="admin-email">Administrator email</label><input id="admin-email" type="email" autocomplete="email" required><div id="otp-wrap" hidden><label class="field-label" for="admin-otp">Email verification code</label><input id="admin-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></div><button class="button primary checkout-button" id="login-button">Send sign-in code</button><p id="login-message" class="form-message" role="status"></p></form></section>
<section id="dashboard" hidden>
<div class="admin-heading"><div><p class="eyebrow">PAYMENT OPERATIONS</p><h1>Dashboard</h1><p id="admin-user" class="field-hint"></p></div><button id="logout-button" class="button secondary">Sign out</button></div>
<div id="stats" class="stats-grid"></div>
<div class="admin-grid">
<section class="payment-card"><h2>Add a service</h2><form id="service-form" class="admin-form"><label class="field-label">Service name<input name="name" required maxlength="120"></label><label class="field-label">Description<input name="description" maxlength="1000"></label><div class="form-grid"><label class="field-label">UGX price<input name="price_ugx" type="number" min="1" step="1" placeholder="Optional"></label><label class="field-label">USD price<input name="price_usd" type="number" min="0.01" step="0.01" placeholder="Optional"></label></div><button class="button primary">Save service</button><p class="form-message" id="service-message"></p></form></section>
<section class="payment-card"><h2>Create an invoice</h2><form id="invoice-form" class="admin-form"><label class="field-label">Customer name<input name="customer_name" required></label><label class="field-label">Customer email<input name="customer_email" type="email" required></label><label class="field-label">Customer phone<input name="customer_phone"></label><label class="field-label">Description<input name="description" required maxlength="500"></label><div class="form-grid"><label class="field-label">Amount<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field-label">Currency<select name="currency"><option>UGX</option><option>USD</option></select></label></div><label class="field-label">Due date (optional)<input name="due_at" type="date"></label><button class="button primary">Create invoice</button><p class="form-message" id="invoice-message"></p></form></section>
</div>
<section class="payment-card admin-table-card"><div class="table-heading"><h2>Recent payments</h2><button id="refresh-button" class="button secondary">Refresh</button></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Customer</th><th>Service / invoice</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead><tbody id="payments-body"></tbody></table></div></section>
<div class="admin-grid"><section class="payment-card"><h2>Services</h2><div id="services-list"></div></section><section class="payment-card"><h2>Invoices</h2><div id="invoices-list"></div></section></div>
<p id="dashboard-message" class="form-message" role="status"></p>
</section>
</main><script src="admin.js" defer></script></body></html>
